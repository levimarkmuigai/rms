<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unit Portfolio</title>
    <link href="/static/css/landlord_pages/shared.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/landlord_pages/unit.css">
    <link rel="stylesheet" href="/static/css/shared.css">
  </head>
  <body>
    <aside>
      <div class="aside-items">
        <span class="aside-wordmark">RMS MENU</span>
        <a href="/landlord">profile</a>
        <a href="/landlord/buildings">buildings</a>
        <a href="/landlord/units" class="current-page">units</a>
      </div>
    </aside>

    <div class="dash-container">
      <header class="dash-header">
        <div class="header-group">
          <a href="/landlord" class="back-link">← back to dashboard</a>
          <h1 class="page-title">units portfolio</h1>
          <span class="date-stamp">{{ units_count }}</span>
        </div>
        <div class="building-nav">
          {{ buildings_list }}
        </div>
      </header>

      {{ unit_header }}

      <div class="table-panel">
        <table>
          <thead>
            <tr>
              <th>unit</th>
              <th>tenant</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {{ units_table }}
          </tbody>
        </table>
      </div>
    </div>

    <div id="assign-unit-modal" class="modal-overlay card-hidden">
      <div class="modal-card" onclick="event.stopPropagation()">
        {{ assign_units }}
      </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
